<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💪 Фитнес на районе | Усогорск</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header glass-panel sticky-header">
    <div class="header-main-row">
        <div class="logo-container">
            <img src="logo.png" alt="Лого" class="logo-img" onerror="this.style.display='none'">
        </div>
        
        <div class="header-center">
            <h1 class="main-title">Фитнес на районе</h1>
        </div>
        
        <div class="admin-container">
            <button id="admin-toggle-btn" class="admin-icon-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
    <div class="header-info">
        <p>Проект осуществляется при поддержке Гранта Главы РК. Система управления бронированием.</p>
    </div>
</header>

    <section class="banner-section glass-panel">
        <img src="banner.jpg.png" alt="АНО Движение - Жизнь" class="banner-image">
    </section>

    <div id="admin-panel-container" class="hidden"> 
        <section class="admin-section glass-panel">
            <h2>➕ Новая тренировка</h2>
            <form id="add-training-form" class="training-form">
                <div class="form-group">
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <input type="time" id="time" required>
                </div>
                <div class="form-group">
                    <input type="text" id="name" placeholder="Название (ОФП, Йога...)" required>
                </div>
                <div class="form-group">
                    <input type="text" id="trainer" placeholder="Тренер" required>
                </div>
                <div class="form-group">
                    <input type="number" id="capacity" min="1" value="10" required>
                </div>
                <button type="submit" class="submit-button">Создать</button>
            </form>
        </section>
    </div>

    <section class="schedule-section glass-panel">
        <h2>🗓️ Текущее расписание</h2>
        <div id="schedule-list" class="schedule-list">
            <p>Загрузка расписания...</p>
        </div>
    </section>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
